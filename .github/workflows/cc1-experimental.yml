name: CC1 experimental checks
on:
  pull_request:
    paths:
      - 'research/circulation-023/**'
      - '.github/workflows/cc1-experimental.yml'
  push:
    branches: ['research/organism-021']
    paths:
      - 'research/circulation-023/**'
      - '.github/workflows/cc1-experimental.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: research/circulation-023
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - run: python -O -m unittest -v
      - run: python benchmark.py
